---
# Non-SaaS overlay — all secrets managed by VSO from Vault.
# Config values (VAULT_ADDR, CLUSTER_NAME, etc.) are injected at deploy time
# via FluxCD postBuild.substituteFrom reading from the aap-vso-config Secret in flux-system.
# The configMapGenerator and transformers are no longer needed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo

resources:
  - ../../base
