---
# Non-SaaS overlay — all secrets managed by VSO from Vault.
# Requires: postgres running at aap/<CLUSTER_NAME>/database/* paths in Vault.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo

resources:
  - ../../base

configMapGenerator:
  - name: config
    namespace: vault-secrets-operator-system
    options:
      disableNameSuffixHash: true
    envs:
      - config.env

transformers:
  - ../../base/transformers
