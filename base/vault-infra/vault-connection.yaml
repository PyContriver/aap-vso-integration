---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: vault-secrets-operator-system
spec:
  address: ${VAULT_ADDR}
  skipTLSVerify: false
  # For HCP Vault / Vault Enterprise: set the namespace header as a map
  # Set VAULT_NAMESPACE=admin in aap-vso-config Secret for HCP Vault
  # Remove headers block for Vault OSS
  headers:
    X-Vault-Namespace: ${VAULT_NAMESPACE}
