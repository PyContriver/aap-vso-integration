---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: vault-secrets-operator-system
spec:
  address: ${VAULT_ADDR}
  skipTLSVerify: false
  # For HCP Vault / Vault Enterprise: set the namespace header
  # Set VAULT_NAMESPACE=admin in aap-vso-config Secret for HCP Vault
  # Leave empty or remove headers block for Vault OSS
  headers:
    - name: X-Vault-Namespace
      value: ${VAULT_NAMESPACE}
