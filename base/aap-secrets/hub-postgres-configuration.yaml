---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: automation-hub-postgres-configuration
  namespace: ansible-automation-platform
spec:
  vaultAuthRef: vault-secrets-operator-system/vault-auth
  mount: ${VAULT_MOUNT}
  type: kv-v2
  path: aap/${CLUSTER_NAME}/database/hub
  refreshAfter: 1m
  destination:
    name: automation-hub-postgres-configuration
    create: true
    transformation:
      templates:
        host:     { text: '{{- .Secrets.host -}}' }
        username: { text: '{{- .Secrets.username -}}' }
        password: { text: '{{- .Secrets.password -}}' }
        database: { text: 'automationhub' }
        port:     { text: '5432' }
        type:     { text: '{{- .Secrets.type | default "unmanaged" -}}' }
        postgres_admin_password: { text: '{{- .Secrets.postgres_admin_password -}}' }
