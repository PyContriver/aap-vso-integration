---
# Source: awx-operator/roles/installer/templates/secrets/admin_password_secret.yaml.j2
# Key name confirmed from operator template: 'password'
# Vault path: aap/<CLUSTER_NAME>/credentials/aap
# Vault key: controller_admin_password
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: automation-controller-admin-password
  namespace: ansible-automation-platform
spec:
  vaultAuthRef: vault-secrets-operator-system/vault-auth
  mount: VAULT_MOUNT_PLACEHOLDER
  type: kv-v2
  path: aap/CLUSTER_NAME/credentials/aap
  refreshAfter: 1m
  destination:
    name: automation-controller-admin-password
    create: true
    transformation:
      templates:
        password:
          text: '{{- .Secrets.controller_admin_password -}}'
