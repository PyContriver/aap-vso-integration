---
# verify-secrets-job.yaml
# Runs after VaultStaticSecrets are created.
# Exits 0 only when all expected K8s Secrets exist in the namespace.
# FluxCD's wait:true on aap-secrets blocks until this Job completes successfully.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-vso-secrets
  namespace: ansible-automation-platform
  annotations:
    # Re-run on every FluxCD reconcile by using a timestamp from configmap
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: verify-vso-secrets-sa
      containers:
      - name: verify
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for all VSO-synced secrets to exist..."
          SECRETS="
            automation-controller-secret-key
            automation-controller-broadcast-websocket
            automation-controller-admin-password
            automation-controller-postgres-configuration
            automation-hub-admin-password
            automation-hub-postgres-configuration
            automation-hub-db-fields-encryption
            automation-eda-admin-password
            automation-eda-postgres-configuration
            automation-eda-db-fields-encryption
            automation-platform-admin-password
            automation-platform-postgres-configuration
          "
          for secret in $SECRETS; do
            echo -n "Checking $secret ... "
            ATTEMPTS=0
            until kubectl get secret "$secret" \
              -n ansible-automation-platform &>/dev/null; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge 60 ]; then
                echo "TIMEOUT waiting for $secret after 10 minutes"
                exit 1
              fi
              sleep 10
            done
            echo "exists ✓"
          done
          echo ""
          echo "All VSO secrets verified — safe to deploy AAP CR"
---
# ServiceAccount for the verify job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verify-vso-secrets-sa
  namespace: ansible-automation-platform
---
# Role to read secrets in the namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verify-vso-secrets-role
  namespace: ansible-automation-platform
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verify-vso-secrets-rolebinding
  namespace: ansible-automation-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verify-vso-secrets-role
subjects:
- kind: ServiceAccount
  name: verify-vso-secrets-sa
  namespace: ansible-automation-platform
