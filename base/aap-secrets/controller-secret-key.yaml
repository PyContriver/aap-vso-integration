---
# Source: awx-operator/roles/installer/templates/secrets/secret_key.yaml.j2
# Key name confirmed from operator template: 'secret_key'
# Vault path: aap/<CLUSTER_NAME>/secrets/controller
# Vault key: secret_key (32-char alphanumeric string)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: automation-controller-secret-key
  namespace: ansible-automation-platform
spec:
  vaultAuthRef: vault-secrets-operator-system/vault-auth
  mount: VAULT_MOUNT_PLACEHOLDER
  type: kv-v2
  path: aap/CLUSTER_NAME/secrets/controller
  refreshAfter: 1m
  destination:
    name: automation-controller-secret-key
    create: true
    transformation:
      templates:
        secret_key:
          text: '{{- .Secrets.secret_key -}}'
