---
# FluxCD Kustomization — installs AAP operator via OLM.
# dependsOn vso-operator: ensures VSO CRDs are registered first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aap-operator
  namespace: flux-system
spec:
  interval: 10m
  wait: true
  prune: true
  suspend: false
  path: ./base/aap-operator
  sourceRef:
    kind: GitRepository
    name: aap-vso-config
    namespace: flux-system
  dependsOn:
    - name: vso-operator
