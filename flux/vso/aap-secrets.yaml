---
# FluxCD Kustomization — creates VaultStaticSecret CRs and waits for VSO sync.
# dependsOn vault-infra: VaultAuth must exist before VaultStaticSecrets reference it.
# FluxCD's wait:true blocks until all VaultStaticSecret resources reach Ready state.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aap-secrets
  namespace: flux-system
spec:
  interval: 10m
  wait: true
  prune: true
  suspend: false
  path: ./base/aap-secrets
  sourceRef:
    kind: GitRepository
    name: aap-vso-config
    namespace: flux-system
  dependsOn:
    - name: vault-infra
  postBuild:
    substituteFrom:
      - kind: Secret
        name: aap-vso-config
        namespace: flux-system
