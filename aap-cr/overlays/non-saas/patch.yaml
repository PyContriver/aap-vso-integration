---
# Non-SaaS patch — on-premises OpenShift (ROSA without EFS, bare-metal, etc.)
# - Hub: NFS RWX storage (local NFS provisioner)
# - Ingress: none (NodePort / manual route setup)
# - Service: NodePort
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: automation-platform
  namespace: ansible-automation-platform
spec:
  service_type: NodePort

  controller:
    ingress_type: none
    service_type: NodePort

  hub:
    file_storage_storage_class: gp3-csi
    file_storage_access_mode: ReadWriteOnce
    ingress_type: none
